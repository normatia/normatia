[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "normatia-mcp"
version = "0.1.0"
description = "MCP server for Normatia — Spanish building code compliance API"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Normatia" }]
dependencies = [
  "mcp>=1.2.0",
  "httpx>=0.28.0",
  "pydantic-settings>=2.0.0",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
normatia-mcp = "normatia_mcp.__main__:main"

[project.urls]
Homepage = "https://normatia.com"
Repository = "https://github.com/normatia/normatia"
Issues = "https://github.com/normatia/normatia/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/normatia_mcp"]